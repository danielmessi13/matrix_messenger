[package]
name = "rust_lib_matrix_messenger"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
eyeball-im = "0.9"
flutter_rust_bridge = "=2.13.0"
futures-util = "0.3"
getrandom = "0.2"
keyring = "4"
log = "0.4"
matrix-sdk = { version = "=0.19.1", features = ["bundled-sqlite", "markdown"] }
matrix-sdk-ui = "=0.19.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
url = "2.5"

[dev-dependencies]
matrix-sdk = { version = "=0.19.1", features = ["bundled-sqlite", "markdown", "testing"] }
matrix-sdk-test = "=0.19.1"
wiremock = "0.6"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
